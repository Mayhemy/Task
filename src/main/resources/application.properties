spring.application.name=ai-diff-reviewer
server.port=8080

# Import an optional .env file at the project root (properties format: KEY=value).
# .env is gitignored; commit .env.example instead.
spring.config.import=optional:file:./.env[.properties]

# Bind environment variables into AppProperties.
app.bearer-token=${APP_BEARER_TOKEN:}
app.llm-base-url=${LLM_BASE_URL:}
app.llm-api-key=${LLM_API_KEY:}
app.llm-model=${LLM_MODEL:}
app.llm-timeout-seconds=${LLM_TIMEOUT_SECONDS:20}

# Keep the default error page from rendering non-envelope JSON; EnvelopeErrorController owns /error.
server.error.include-message=never
