spring.application.name=ai-diff-reviewer
server.port=8080

# Import an optional .env file at the project root (properties format: KEY=value).
# .env is gitignored; commit .env.example instead.
spring.config.import=optional:file:./.env[.properties]

# Bind environment variables into AppProperties.
app.bearer-token=${APP_BEARER_TOKEN:}
app.llm-base-url=${LLM_BASE_URL:}
app.llm-api-key=${LLM_API_KEY:}
app.llm-model=${LLM_MODEL:}
app.llm-timeout-seconds=${LLM_TIMEOUT_SECONDS:20}

# Keep the default error page from rendering non-envelope JSON; EnvelopeErrorController owns /error.
server.error.include-message=never

# How much still-unsent request body Tomcat will read and discard after we have
# already answered. This matters for the 413: we reject as soon as the 1 MiB
# limit trips, which commits the response while the client is still uploading.
# Tomcat then swallows the remainder so the connection can close cleanly — but
# past this cap it aborts instead, and an intermediary relaying into an aborted
# upstream resets the client. Clients that read while writing (curl) still see
# the 413; clients that write the whole body first (python-requests, urllib)
# see a ConnectionError and never read the status we sent.
#
# The default is 2 MiB, which is exactly where the failure started when measured
# through the tunnel: 1.5 MiB returned 413, 2 MiB reset. Raised to 8 MiB so any
# realistic oversized payload gets the real status code. Deliberately NOT
# unlimited — this is the bound on how much of a body we are willing to read
# purely to be polite about closing.
server.tomcat.max-swallow-size=8388608
